name: LMS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check server JavaScript syntax
        run: find server/src -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Build workspaces
        run: npm run build
